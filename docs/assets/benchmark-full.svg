<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">13-task benchmark results</title>
<desc id="desc">Thirteen tasks with three repetitions. Causeloom uses 39 a5 trials; the no-skill baseline uses 27 a5 trials and 12 completed historical a3 trials. Descriptive two-phase context, not a fully matched causal estimate.</desc>
<rect width="960" height="350" fill="#FFFFFF"/>
<text x="48" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#172033" text-anchor="start">13-task benchmark results</text>
<text x="48" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#667085" text-anchor="start">13 tasks x 3 repetitions - 39 attempts per condition</text>
<line x1="220.0" y1="117" x2="220.0" y2="275" stroke="#D9E0EA"/>
<text x="220.0" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">0%</text>
<line x1="350.0" y1="117" x2="350.0" y2="275" stroke="#D9E0EA"/>
<text x="350.0" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">20%</text>
<line x1="480.0" y1="117" x2="480.0" y2="275" stroke="#D9E0EA"/>
<text x="480.0" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">40%</text>
<line x1="610.0" y1="117" x2="610.0" y2="275" stroke="#D9E0EA"/>
<text x="610.0" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">60%</text>
<line x1="740.0" y1="117" x2="740.0" y2="275" stroke="#D9E0EA"/>
<text x="740.0" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">80%</text>
<line x1="870.0" y1="117" x2="870.0" y2="275" stroke="#D9E0EA"/>
<text x="870.0" y="301" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">100%</text>
<text x="202" y="149" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="end">No-skill baseline</text>
<rect x="220" y="125" width="333.33333333333337" height="32" rx="3" fill="#A7B0BF"/>
<text x="563.3333333333334" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#172033" text-anchor="start">20/39 - 51.3%</text>
<text x="202" y="219" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172033" text-anchor="end">Causeloom</text>
<rect x="220" y="195" width="450.0" height="32" rx="3" fill="#356AE6"/>
<text x="680.0" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#172033" text-anchor="start">27/39 - 69.2%</text>
<text x="48" y="336" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#667085" text-anchor="start">Two-phase descriptive view: 12 baseline cells use the earlier a3 timeout contract.</text>
</svg>
